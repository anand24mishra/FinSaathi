# Backup pinger for the Render free web service (free because this repo is public). The in-app pinger (backend/src/core/keepAlive.ts)
# is the primary; this one can also WAKE the service if it ever does sleep. Hits a real route (Render answers /robots.txt itself).
name: keep-alive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://finsaathi-x3xn.onrender.com/v1/health
